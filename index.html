<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Museo Virtual del Sistema Solar</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --fondo:#05070f; --texto:#e8ecf8; --acento:#ffb347; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--fondo); color:var(--texto);
         display:flex; flex-direction:column; min-height:100vh; }
  header { padding:.6rem 1rem; text-align:center; }
  h1 { font-size:1.2rem; margin:0; }
  #contador { font-size:.8rem; opacity:.7; }
  model-viewer { width:100%; flex:1; min-height:55vh; background:radial-gradient(#101830,#05070f); }
  #info { padding:.8rem 1rem; max-width:40rem; margin:auto; }
  #info h2 { margin:.2rem 0; color:var(--acento); font-size:1.1rem; }
  #info p { margin:.2rem 0; font-size:.95rem; line-height:1.4; }
  nav { display:flex; gap:.5rem; justify-content:center; padding:.8rem; flex-wrap:wrap; }
  nav button, #btnAR { background:#1a2340; color:var(--texto); border:1px solid #33407a;
         border-radius:10px; padding:.7rem 1rem; font-size:1rem; cursor:pointer; }
  nav button:active { background:var(--acento); color:#000; }
  #btnAR { position:absolute; bottom:12px; right:12px; }
  .cargando { position:absolute; inset:auto 0 50% 0; text-align:center; }
</style>
</head>
<body>

<header>
  <h1>🪐 Museo Virtual del Sistema Solar</h1>
  <div id="contador"></div>
</header>

<model-viewer id="visor"
  alt="Modelo 3D"
  camera-controls
  auto-rotate
  ar
  ar-modes="scene-viewer webxr quick-look"
  ar-scale="auto"
  shadow-intensity="0"
  loading="eager"
  reveal="auto">
  <button slot="ar-button" id="btnAR">👋 Ver en tu espacio (AR)</button>
  <div slot="progress-bar" class="cargando"></div>
</model-viewer>

<section id="info">
  <h2 id="titulo"></h2>
  <p id="texto"></p>
  <p id="dato" style="opacity:.75"></p>
</section>

<nav>
  <button id="btnAtras">⬅ Atrás</button>
  <button id="btnInicio">🏠 Inicio</button>
  <button id="btnSiguiente">Siguiente ➡</button>
  <button id="btnFoto">📷 Foto</button>
</nav>

<script>
/* ===== 1. CATÁLOGO: aquí agregas/editas cada pieza del museo =====
   archivo: ruta al .glb (carpeta models/)
   escala:  tamaño relativo en AR para que quepa en 4 x 4 m (ver guía)   */
const piezas = [
  { id:"sol",      nombre:"Sistema Solar (Inicio)", archivo:"models/inicio.glb",
    texto:"Bienvenida al museo. Usa Siguiente para recorrer los mundos.", dato:"" },
  { id:"mercurio", nombre:"Mercurio", archivo:"models/mercurio.glb",
    texto:"El planeta más cercano al Sol y el más pequeño.", dato:"Diámetro: 4 879 km" },
  { id:"venus",    nombre:"Venus", archivo:"models/venus.glb",
    texto:"Su atmósfera densa atrapa el calor: es el planeta más caliente.", dato:"Diámetro: 12 104 km" },
  { id:"tierra",   nombre:"Tierra", archivo:"models/tierra.glb",
    texto:"Nuestro hogar, el único mundo con vida conocida.", dato:"Diámetro: 12 742 km" },
  { id:"luna",     nombre:"La Luna", archivo:"models/luna.glb",
    texto:"Satélite natural de la Tierra; causa las mareas.", dato:"Diámetro: 3 474 km" },
  { id:"marte",    nombre:"Marte", archivo:"models/marte.glb",
    texto:"El planeta rojo, con el volcán más alto: el Monte Olimpo.", dato:"Diámetro: 6 779 km" },
  { id:"asteroides",nombre:"Cinturón de asteroides", archivo:"models/asteroides.glb",
    texto:"Millones de rocas entre Marte y Júpiter, restos de la formación del sistema solar.", dato:"" },
  { id:"jupiter",  nombre:"Júpiter", archivo:"models/jupiter.glb",
    texto:"El gigante gaseoso; su Gran Mancha Roja es una tormenta enorme.", dato:"Diámetro: 139 820 km" },
  { id:"io",       nombre:"Ío", archivo:"models/io.glb",
    texto:"Luna galileana, el cuerpo con más volcanes activos.", dato:"Diámetro: 3 643 km" },
  { id:"europa",   nombre:"Europa", archivo:"models/europa.glb",
    texto:"Luna galileana con un océano oculto bajo su hielo.", dato:"Diámetro: 3 122 km" },
  { id:"ganimedes",nombre:"Ganímedes", archivo:"models/ganimedes.glb",
    texto:"La luna más grande del sistema solar, mayor que Mercurio.", dato:"Diámetro: 5 268 km" },
  { id:"calisto",  nombre:"Calisto", archivo:"models/calisto.glb",
    texto:"Luna galileana muy craterizada, de superficie antigua.", dato:"Diámetro: 4 821 km" },
  { id:"saturno",  nombre:"Saturno", archivo:"models/saturno.glb",
    texto:"Famoso por sus anillos de hielo y roca.", dato:"Diámetro: 116 460 km" },
  { id:"urano",    nombre:"Urano", archivo:"models/urano.glb",
    texto:"Gigante helado que gira 'acostado' sobre su costado.", dato:"Diámetro: 50 724 km" },
  { id:"neptuno",  nombre:"Neptuno", archivo:"models/neptuno.glb",
    texto:"El planeta más lejano, con los vientos más veloces.", dato:"Diámetro: 49 244 km" },
  { id:"cometa",   nombre:"Cometa", archivo:"models/cometa.glb",
    texto:"Bola de hielo y polvo que desarrolla cola al acercarse al Sol.", dato:"" },
  { id:"hubble",   nombre:"Telescopio Espacial Hubble", archivo:"models/hubble.glb",
    texto:"En órbita terrestre desde 1990, nos dio imágenes icónicas del universo.", dato:"Órbita: ~540 km" },
  { id:"webb",     nombre:"Telescopio James Webb", archivo:"models/webb.glb",
    texto:"Observa en infrarrojo desde el punto L2, a 1.5 millones de km.", dato:"Espejo: 6.5 m" },
  { id:"parker",   nombre:"Sonda Parker", archivo:"models/parker.glb",
    texto:"Se acerca al Sol más que cualquier otra nave para estudiar su corona.", dato:"" }
];

/* ===== 2. LÓGICA ===== */
const visor = document.getElementById("visor");
let actual = 0;

function mostrar(i) {
  actual = (i + piezas.length) % piezas.length;      // da la vuelta al llegar al final
  const p = piezas[actual];
  visor.src = p.archivo;
  visor.alt = "Modelo 3D de " + p.nombre;
  document.getElementById("titulo").textContent = p.nombre;
  document.getElementById("texto").textContent  = p.texto;
  document.getElementById("dato").textContent   = p.dato;
  document.getElementById("contador").textContent = (actual + 1) + " / " + piezas.length;
  precargar((actual + 1) % piezas.length);           // baja el siguiente en segundo plano
}

/* Precarga solo la siguiente pieza (ahorra datos móviles) */
function precargar(i) {
  fetch(piezas[i].archivo).catch(() => {});
}

document.getElementById("btnAtras").onclick     = () => mostrar(actual - 1);
document.getElementById("btnSiguiente").onclick = () => mostrar(actual + 1);
document.getElementById("btnInicio").onclick    = () => mostrar(0);

/* Foto: captura lo que ve el visor 3D y la descarga como PNG */
document.getElementById("btnFoto").onclick = async () => {
  try {
    const blob = await visor.toBlob({ mimeType: "image/png", idealAspect: true });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "museo-" + piezas[actual].id + ".png";
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) {
    alert("No se pudo tomar la foto. En modo AR usa la captura de pantalla de tu teléfono.");
  }
};

mostrar(0);
</script>
</body>
</html>
